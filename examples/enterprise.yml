name: example-register-deployment-enterprise
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    environment: bridgedai-demo
    steps:
      - uses: bridgedai-devsecops/register-deployment-action@v1.0.0
        with:
          tenant: demo
          image: ghcr.io/example/demo
          digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          environment: production
          mode: mock

